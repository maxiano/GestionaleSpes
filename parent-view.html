<div id="parent-portal-container" class="max-w-md mx-auto p-4 flex flex-col gap-5">
    
    <!-- Intestazione Portale Genitori -->
    <div class="bg-slate-900 text-white p-5 rounded-2xl shadow-xl flex items-center justify-between gap-4">
        <!-- Aggiunto min-w-0 per gestire correttamente nomi lunghi o la select -->
        <div class="min-w-0 flex-1">
            <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Portale Famiglia</span>
            <!-- ID target per l'iniezione del nome o della <select> da JS -->
            <div id="parent-child-name" class="text-xl font-extrabold mt-0.5 truncate">Caricamento...</div>
        </div>
        <button id="btn-parent-logout" class="bg-white/10 hover:bg-white/20 text-white text-xs font-bold py-2 px-3 rounded-xl transition shrink-0">
            Esci 🚪
        </button>
    </div>

    <!-- SELETTORE A TAB -->
    <div class="flex bg-slate-200 p-1 rounded-xl">
        <button id="tab-btn-trainings" onclick="switchParentTab('trainings')" class="flex-1 py-2.5 text-xs font-bold rounded-lg transition bg-white text-slate-900 shadow-sm">
            🏃‍♂️ Allenamenti
        </button>
        <button id="tab-btn-matches" onclick="switchParentTab('matches')" class="flex-1 py-2.5 text-xs font-bold rounded-lg transition text-slate-600 hover:text-slate-900">
            ⚽ Partite
        </button>
    </div>

    <!-- CONTENUTO TAB ALLENAMENTI -->
    <div id="tab-content-trainings" class="flex flex-col gap-4">
        <!-- Inserito da JS -->
    </div>

    <!-- CONTENUTO TAB PARTITE -->
    <div id="tab-content-matches" class="flex flex-col gap-4 hidden">
        <!-- Inserito da JS -->
    </div>

</div>
