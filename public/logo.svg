<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#000000"/>
  
  <g fill="#ffffff">
    <!-- Top curved cap of the S -->
    <path d="M 210 148 C 245 92 355 92 390 148 L 368 174 C 342 128 258 128 232 174 Z" />

    <!-- S diagonal & upper hook crossing into M -->
    <path d="M 232 174 L 260 142 L 320 190 L 300 215 Z" />
    <path d="M 390 148 L 330 220 L 308 198 L 368 174 Z" />

    <!-- Left wing of M -->
    <polygon points="180,325 210,140 234,144 204,325" />

    <!-- Right wing of M -->
    <polygon points="420,325 390,140 366,144 396,325" />

    <!-- Inner V legs of M joining at bottom point -->
    <polygon points="210,140 234,144 300,315 284,322" />
    <polygon points="390,140 366,144 300,315 316,322" />
    <polygon points="284,322 300,315 316,322 300,342" />

    <!-- Central S intersection / chevron -->
    <polygon points="248,180 300,248 352,180 332,165 300,208 268,165" />
  </g>

  <!-- Typography matching exact font style in the user image -->
  <!-- SPES -->
  <text x="300" y="416" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" letter-spacing="0.08em">SPES</text>
  
  <!-- MONTESACRO -->
  <text x="300" y="470" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="37" letter-spacing="0.04em">MONTESACRO</text>
  
  <!-- fondata nel 1928 -->
  <text x="300" y="512" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="500" font-size="21" letter-spacing="0.01em">fondata nel 1928</text>
</svg>