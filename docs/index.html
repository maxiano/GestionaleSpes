    <!-- Reindirizzamento automatico per GitHub Pages se servito da root senza Actions -->
    <script type="text/javascript">
      (function() {
        var isGitHub = window.location.hostname.indexOf('github.io') !== -1;
        var pathname = window.location.pathname;
        if (isGitHub && !pathname.endsWith('/docs/') && pathname.indexOf('/docs/') === -1) {
          var cleanPath = pathname.replace(/\/$/, '');
          window.location.replace(cleanPath + '/docs/' + window.location.search + window.location.hash);

      })();
    </script>

    <!-- GitHub Pages Single Page App routing support -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
