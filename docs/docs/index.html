<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <title>Spes Montesacro Gestionale</title>
    <script type="text/javascript">
      // Reindirizza pulito alla root dell'app GitHub Pages senza query param né loop
      var repo = '/GestionaleSpes/';
      if (window.location.pathname.indexOf(repo) !== -1) {
        window.location.replace(window.location.origin + repo);
      } else {
        window.location.replace('./');
      }
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; background-color: #f8fafc; color: #334155;">
    <h2>Reindirizzamento all'applicazione in corso...</h2>
    <p><a href="/GestionaleSpes/" style="color: #059669; font-weight: 600;">Clicca qui se non vieni reindirizzato automaticamente</a></p>
  </body>
</html>
